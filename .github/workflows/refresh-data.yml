# Refreshes market data after the NSE close and publishes app + data to the `deploy` branch.
#
# The `deploy` branch is re-created as a single orphan commit every run (force-push), so the
# repository history does not grow with daily price files. Point Streamlit Community Cloud
# (or any host) at the `deploy` branch; it redeploys automatically on every push.
name: refresh-data

on:
  schedule:
    - cron: "45 11 * * 1-5"   # 17:15 IST, Mon–Fri: prices (+ market cap) → rebuild → snapshot
    - cron: "15 3 * * 6"      # 08:45 IST, Saturday: weekly job incl. shares + fundamentals
  workflow_dispatch:
    inputs:
      task:
        description: "daily | weekly | full (re-download full price history)"
        default: "daily"

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore previously published market data
        run: |
          if git ls-remote --exit-code --heads origin deploy >/dev/null 2>&1; then
            git fetch origin deploy --depth=1
            git checkout origin/deploy -- data/market || true
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh
        env:
          TASK: ${{ github.event.inputs.task || '' }}
        run: |
          if [ "$TASK" = "full" ]; then python -m tracker.refresh weekly --full
          elif [ "$TASK" = "weekly" ] || [ "${{ github.event.schedule }}" = "15 3 * * 6" ]; then python -m tracker.refresh weekly
          else python -m tracker.refresh daily; fi

      - name: Tests (engine + data integrity)
        run: python -m pytest tests/test_analytics.py tests/test_seed_and_mcap.py

      - name: Publish to deploy branch (single squashed commit)
        run: |
          git config user.name  "sector-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan deploy-tmp
          git add -A
          git commit -q -m "Data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin deploy-tmp:deploy
