[theme]
base = "light"
# Soft pastel light theme: lavender-white page, white cards, violet accent.
primaryColor = "#6250d6"
backgroundColor = "#f6f5fb"
secondaryBackgroundColor = "#eeecf8"
textColor = "#2b2a3d"
linkColor = "#5243c2"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseRadius = "0.75rem"
borderColor = "#e4e1f0"
dataframeBorderColor = "#ece9f5"
showWidgetBorder = true
# Validated categorical order (blue, orange, aqua, yellow, pink, green, violet, red)
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f1fb"
borderColor = "#ebe8f5"

[client]
# Navigation is drawn by dashboard/common.py (with icons and a proper "Market Overview" label)
showSidebarNavigation = false

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false
